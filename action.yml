name: "Z.ai Code Review"
description: "AI-powered code review using Z.ai models"
inputs:
  ZAI_API_KEY:
    description: "Z.ai API key"
    required: true
  ZAI_MODEL:
    description: "Z.ai AI model"
    required: false
    default: "glm-4.7"
  ZAI_SYSTEM_PROMPT:
    description: "Custom system prompt for the AI reviewer"
    required: false
    default: "You are an expert code reviewer. Review the provided code changes and give clear, actionable feedback."
  ZAI_REVIEWER_NAME:
    description: "Name shown in the review comment header"
    required: false
    default: "Z.ai Code Review"
  EXCLUDE_PATTERNS:
    description: "Comma-separated file patterns to exclude from review (e.g. '*.lock,dist/**,*.min.js')"
    required: false
    default: "*.lock,package-lock.json,yarn.lock,pnpm-lock.yaml"
  MAX_DIFF_CHARS:
    description: "Maximum total characters for the diff sent to the API (0 = unlimited)"
    required: false
    default: "0"
  POST_INLINE_COMMENTS:
    description: "Post findings as inline PR review comments instead of a single summary comment"
    required: false
    default: "true"
  INCLUDE_PROJECT_INSTRUCTIONS:
    description: "Read project instruction files (CLAUDE.md, AGENTS.md, etc.) and include them in the review prompt"
    required: false
    default: "true"
  PROJECT_INSTRUCTION_FILES:
    description: "Comma-separated list of instruction file names to look for in the repo"
    required: false
    default: "CLAUDE.md,AGENTS.md,.github/copilot-instructions.md"
  MIN_CONFIDENCE:
    description: "Minimum confidence percentage (0-100) for a finding to be included in the review"
    required: false
    default: "80"
  TRUSTED_INSTRUCTIONS_REF:
    description: "Which branch to read instruction files from: 'base' (PR target) or 'head' (PR source)"
    required: false
    default: "base"
  GITHUB_TOKEN:
    description: "GitHub token for API access"
    required: false
    default: ${{ github.token }}
runs:
  using: "node20"
  main: "dist/index.js"
branding:
  icon: "check-circle"
  color: "gray-dark"