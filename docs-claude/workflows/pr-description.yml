name: AI PR Description Generator

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  generate-description:
    name: Generate PR Description
    runs-on: self-hosted
    steps:
      - name: Generate PR Description
        uses: rafaelqw/zai-code-review/pr-description@main
        with:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_MODEL: ${{ vars.ZAI_MODEL }}

          OVERWRITE_EXISTING: "false"
          MIN_DESCRIPTION_LENGTH: "50"
          INCLUDE_PROJECT_INSTRUCTIONS: "true"
          PROJECT_INSTRUCTION_FILES: "CLAUDE.md,AGENTS.md,.github/copilot-instructions.md"
          TRUSTED_INSTRUCTIONS_REF: "base"
